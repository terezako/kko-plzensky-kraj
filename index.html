/* KKO visual identity: vivid regional green, signal yellow, black and white. */
:root{--paper:#fff;--ink:#080808;--muted:#454545;--line:#111;--orange:#4caf50;--green:#4caf50;--blue:#f5f5ed;--lav:#fff33f;--yellow:#fff33f;--white:#fff}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--paper)}
.top{height:78px;border-bottom:0;background:#fff}
.logo{position:relative;isolation:isolate;align-items:center;gap:12px;letter-spacing:-.09em}
.logo img{display:block;width:105px;height:64px;object-fit:contain}
.logo span{color:var(--ink);font-size:10px;letter-spacing:.08em}
.tab.active{border-bottom:4px solid var(--green)}
main{max-width:1180px}.intro{grid-template-columns:1fr}
.eyebrow,.kicker{color:var(--ink)}
.eyebrow:before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;background:var(--yellow);border:1px solid var(--ink)}
h1,.activity-title,.admin-head h1{font-weight:700;letter-spacing:-.075em}



.progress{height:7px;background:#e5e5e5;border:1px solid var(--ink)}.progress i{background:var(--green)}
.step{color:#707070}.step.current{background:var(--yellow);color:var(--ink)}.step.done{color:#23772c}
.card{border:2px solid var(--ink);background:#fff;box-shadow:none}
.card-top .kicker:last-child{background:var(--yellow);padding:6px 8px;color:var(--ink)}
.chip{border:1px solid var(--ink);border-radius:0;background:#fff}
.chip:hover{background:var(--yellow);border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.chip.selected{background:var(--green);color:var(--ink);border-color:var(--ink)}
.chip.reject{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.selected-area{background:#f5f5ed;border:1px dashed var(--ink)}
.slider-row input{accent-color:var(--green)}
.select,.textarea{border:1px solid var(--ink);border-radius:0;background:#fff}
.btn{background:var(--ink);border:2px solid var(--ink);border-radius:0;color:#fff}
.btn:hover{background:var(--green);border-color:var(--ink);color:var(--ink)}
.btn.ghost{background:#fff}.btn.ghost:hover{background:var(--yellow)}
.done-icon{border-radius:0;background:var(--yellow);border:2px solid var(--ink)}
.stat,.panel{background:#fff;border:1px solid var(--ink);border-radius:0}
.stat strong{font-weight:700}.bar{background:#eee;border-radius:0}.bar i{background:var(--green);border-right:1px solid var(--ink);border-radius:0}
.heatitem{background:#f5f5ed;border-left:4px solid var(--yellow)}
.pill{border-color:var(--ink);border-radius:0}
.footer{border-top:0}
.welcome-screen{min-height:300px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;text-align:left;padding:clamp(32px,5vw,64px)}.welcome-screen h2{font-size:clamp(36px,5vw,56px);letter-spacing:-.065em;line-height:1;margin:0 0 12px}.welcome-screen p{margin:0}.welcome-actions .btn{min-width:210px}@media(max-width:760px){.card{box-shadow:none}.step.current{background:var(--green);color:var(--ink)}.logo img{width:82px;height:50px}.welcome-screen{grid-template-columns:1fr;min-height:240px;gap:24px;padding:28px 22px}.welcome-actions .btn{min-width:0}}
@media print{body{background:#fff;color:#080808}.top,#surveyView,.footer button,.export-actions{display:none!important}#adminView{display:block!important;max-width:none;margin:0;padding:0}.admin-head{border-bottom:2px solid #4caf50;padding-bottom:12px}.admin-head h1{font-size:32px}.panel,.stat{background:#fff;break-inside:avoid;border-color:#111}.grid2{grid-template-columns:1fr 1fr}.text-list{max-height:none;overflow:visible}.bar i,.bar{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

function start(){idx=0;ans={};render()}
function nav(){return `<div class="nav"><button class="btn ghost" onclick="back()" ${idx<=0?'disabled':''}>← ZPĚT</button><span class="counter">${String(idx+1).padStart(2,'0')} / 08</span><button class="btn" onclick="next()">${idx===7?'ODESLAT':'POKRAČOVAT →'}</button></div>`}
function render(){if(idx<0){$('#progressText').textContent='PŘIPRAVEN/A?';$('#progressNum').textContent='00 / 08';$('#progressBar').style.width='0%';$('#steps').innerHTML=A.map((a,i)=>`<div class="step"><b>${String(i+1).padStart(2,'0')}</b>${a.name}</div>`).join('');$('#activity').innerHTML=`<div class="welcome-screen"><div class="welcome-copy"><h2>Začneme?</h2><p class="subtle">Přibližně 7–10 minut · bez správných odpovědí</p></div><div class="welcome-actions"><button class="btn" onclick="start()">ZAČÍT AKTIVITU →</button></div></div>`;return}if(idx>=8){$('#progressText').textContent='DOKONČENO';$('#progressNum').textContent='08 / 08';$('#progressBar').style.width='100%';$('#activity').innerHTML=`<div class="done-screen"><div class="done-icon">✓</div><div class="eyebrow">Díky, jsi součástí</div><h2>Právě jsi pomohl/a<br>postavit KKO.</h2><p class="subtle">Tvoje odpověď se připojila ke společnému obrazu značky.</p><button class="btn" onclick="setView('admin')">PROHLÉDNOUT SPOLEČNÝ OBRAZ →</button><p><button class="tab" onclick="idx=-1;render()">VYPLNIT ZNOVU</button></p></div>`;return}
const a=A[idx];$('#progressText').textContent=`AKTIVITA ${String(idx+1).padStart(2,'0')}`;$('#progressNum').textContent=`${String(idx+1).padStart(2,'0')} / 08`;$('#progressBar').style.width=`${(idx+1)/8*100}%`;$('#steps').innerHTML=A.map((x,i)=>`<div class="step ${i===idx?'current':i<idx?'done':''}"><b>${String(i+1).padStart(2,'0')}</b>${x.name}</div>`).join('');let body='';
if(a.type.startsWith('pick')){let lim=a.type==='pick5reject'?5:a.type==='pick3reject'?3:2;let chosen=ans[a.id]?.chosen||[];body=`<div class="selected-area"><span class="area-label">TVOJE VÝBĚRY · ${chosen.length}/${lim}</span><div class="area-chips">${chosen.map(x=>`<button class="chip selected" onclick="toggle('${a.id}','${esc(x)}',${lim})">${esc(x)} ×</button>`).join('')||'<span class="subtle">Vybrané karty se objeví tady.</span>'}</div></div><div class="options">${a.items.map(x=>`<button class="chip ${chosen.includes(x)?'selected':''}" onclick="toggle('${a.id}','${esc(x)}',${lim})">${esc(x)}</button>`).join('')}</div>${chosen.length===lim?`<p class="field-label">Teď jednu vyřaď — která je nejméně důležitá?</p><div class="options">${chosen.map(x=>`<button class="chip ${ans[a.id]?.reject===x?'reject':''}" onclick="reject('${a.id}','${esc(x)}')">${esc(x)}${ans[a.id]?.reject===x?' · VYŘAZENO':''}</button>`).join('')}</div>`:''}`}
if(a.type==='sliders'||a.type==='character'){let vals=ans[a.id]?.values||a.pairs.map(()=>50);body=`${a.pairs.map((p,i)=>`<div class="slider-row"><div class="slider-labels"><span>${p[0]}</span><span>${p[1]}</span></div><input type="range" min="0" max="100" value="${vals[i]}" oninput="slide('${a.id}',${i},this.value,this)"><div class="range-name">${vals[i]<35?p[0]:vals[i]>65?p[1]:'ROVNOVÁHA'}</div></div>`).join('')}`;if(a.type==='sliders')body+=`<label class="field-label">Kdyby KKO mohlo plnit pouze jednu roli, kterou by sis vybral/a?</label><div class="single-role">${['Informovat','Inspirovat','Poučit','Pobavit','Uklidnit','Nadchnout','Vysvětlovat','Aktivizovat','Propojovat','Motivovat'].map(x=>`<button class="chip ${(ans[a.id]?.priority||'')===x?'selected':''}" onclick="priority('${a.id}','${x}')">${x}</button>`).join('')}</div>`;else body+=`<label class="field-label">Vyber 3 vlastnosti, bez kterých by KKO nebylo KKO.</label><div class="options">${a.items.map(x=>`<button class="chip ${(ans[a.id]?.core||[]).includes(x)?'selected':''}" onclick="core('${a.id}','${x}')">${x}</button>`).join('')}</div><div class="counter">VYBRÁNO ${(ans[a.id]?.core||[]).length} / 3</div>`}
if(a.type==='future')body=`<div class="yearline"><strong>2026</strong><span>····················→</span><strong>2029</strong></div><div class="options">${a.items.map(x=>`<button class="chip ${(ans[a.id]?.chosen||[]).includes(x)?'selected':''}" onclick="multi('${a.id}','${esc(x)}',2)">${esc(x)}</button>`).join('')}</div><label class="field-label">Napiš titulek článku z roku 2029.</label><input class="textarea" id="headline" maxlength="100" placeholder="KKO změnilo…" value="${esc(ans[a.id]?.headline||'')}" oninput="setText('${a.id}','headline',this.value)">`;
if(a.type==='contract')body=`<div class="options">${a.sentences.map(x=>`<button class="chip ${(ans[a.id]?.sentence||'')===x?'selected':''}" onclick="sentence('${a.id}','${x}')">${x}</button>`).join('')}</div>${ans[a.id]?.sentence?`<label class="field-label">${esc(ans[a.id].sentence)}</label><select class="select" onchange="setValue('${a.id}',this.value)"><option value="">Vyber pokračování…</option>${a.values.map(x=>`<option ${ans[a.id]?.value===x?'selected':''}>${x}</option>`).join('')}</select><label class="field-label">Tvoje vlastní doplnění (nepovinné)</label><textarea class="textarea" maxlength="160" placeholder="Doplň vlastní slova…" oninput="setText('${a.id}','custom',this.value)">${esc(ans[a.id]?.custom||'')}</textarea>`:''}`;
if(a.type==='motive')body=`<div class="options">${a.items.map(x=>`<button class="chip ${(ans[a.id]?.choice||'')===x?'selected':''}" onclick="choice('${a.id}','${esc(x)}')">${esc(x)}</button>`).join('')}</div>${ans[a.id]?.choice?`<label class="field-label">${ans[a.id].choice==='Jiný důvod'?'Jaký je tvůj důvod?':'Chceš to rozvést? (nepovinné)'}</label><textarea class="textarea" maxlength="160" placeholder="${ans[a.id].choice==='Jiný důvod'?'Napiš svůj důvod…':'Doplň pár slov…'}" oninput="setText('${a.id}','custom',this.value)">${esc(ans[a.id]?.custom||'')}</textarea>`:''}`;
$('#activity').innerHTML=`<div class="card-top"><span class="kicker">${String(idx+1).padStart(2,'0')} / ${a.name}</span><span class="kicker">KKO · PLZEŇSKÝ KRAJ</span></div><h2 class="activity-title">${a.title}</h2><p class="instruction">${a.instruction}</p>${body}${nav()}`}
function toggle(id,x,lim){let c=ans[id]?.chosen||[];if(c.includes(x))c=c.filter(y=>y!==x);else if(c.length<lim)c=[...c,x];ans[id]={...ans[id],chosen:c};if(ans[id].reject&&!c.includes(ans[id].reject))delete ans[id].reject;render()}
function reject(id,x){ans[id]={...ans[id],reject:ans[id]?.reject===x?'':x};render()}function slide(id,i,v,el){ans[id]??={values:A[idx].pairs.map(()=>50)};ans[id].values[i]=+v;el.nextElementSibling.textContent=v<35?A[idx].pairs[i][0]:v>65?A[idx].pairs[i][1]:'ROVNOVÁHA'}function priority(id,x){ans[id]={...ans[id],priority:x};render()}function core(id,x){let c=ans[id]?.core||[];ans[id]={...ans[id],core:c.includes(x)?c.filter(y=>y!==x):c.length<3?[...c,x]:c};render()}function multi(id,x,n){let c=ans[id]?.chosen||[];if(c.includes(x))c=c.filter(y=>y!==x);else if(c.length<n)c.push(x);ans[id]={...ans[id],chosen:c};render()}function setText(id,k,v){ans[id]={...ans[id],[k]:v}}function sentence(id,x){ans[id]={sentence:x};render()}function setValue(id,v){ans[id]={...ans[id],value:v}}function choice(id,x){ans[id]={...ans[id],choice:x};render()}
function back(){if(idx>0){idx--;render()}else{idx=-1;render()}}async function next(){if(!valid())return;if(idx===7){const row={id:crypto.randomUUID?.()||Date.now().toString(),at:new Date().toISOString(),answers:ans};try{if(remote){const response=await fetch(window.KKO_CONFIG.supabaseUrl+'/rest/v1/responses',{method:'POST',headers:{apikey:window.KKO_CONFIG.supabasePublishableKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({answers:ans})});if(!response.ok)throw new Error('submit failed')}else{db.push(row);localStorage.setItem(key,JSON.stringify(db))}idx=8}catch{alert('Odpověď se nepodařilo uložit. Zkontroluj připojení a zkus to znovu.');return}}else idx++;render()}function valid(){let a=A[idx],v=ans[a.id]||{};if(a.type==='pick5reject')return v.chosen?.length===5&&!!v.reject;if(a.type==='pick3reject')return v.chosen?.length===3&&!!v.reject;if(a.type==='pick2reject')return v.chosen?.length===2&&!!v.reject;if(a.type==='sliders')return !!v.priority;if(a.type==='character')return (v.core||[]).length===3;if(a.type==='future')return (v.chosen||[]).length===2&&!!v.headline?.trim();if(a.type==='contract')return !!v.sentence&&!!v.value;if(a.type==='motive')return !!v.choice&&(v.choice!=='Jiný důvod'||!!v.custom?.trim());return true}
function counts(items,fn){let m={};db.forEach(r=>{let vals=fn(r.answers)||[];vals.forEach(x=>m[x]=(m[x]||0)+1)});return items.map(x=>[x,m[x]||0]).sort((a,b)=>b[1]-a[1])}function bars(title,rows,total=db.length){return `<div class="panel"><h3>${title}</h3>${rows.length?rows.map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="bar"><i style="width:${Math.min(100,total?v/total*100:0)}%"></i></div><b>${v}</b></div>`).join(''):'<div class="subtle">Zatím bez odpovědí.</div>'}</div>`}
async function dashboard(){if(remote){const token=sessionStorage.getItem('kko_admin_token');if(!token){$('#dashboard').innerHTML=adminLoginView();return}try{const response=await fetch(window.KKO_CONFIG.supabaseUrl+'/rest/v1/responses?select=id,created_at,answers&order=created_at.asc',{headers:{apikey:window.KKO_CONFIG.supabasePublishableKey,Authorization:'Bearer '+token}});if(!response.ok)throw new Error('read failed');db=(await response.json()).map(row=>({id:row.id,at:row.created_at,answers:row.answers}))}catch{$('#dashboard').innerHTML=adminLoginView('Přihlášení vypršelo nebo se nepodařilo načíst data.');return}}else db=JSON.parse(localStorage.getItem(key)||'[]');if(!db.length){$('#dashboard').innerHTML='<div class="empty"><div class="done-icon">✳</div><h3>Společný obraz se teprve skládá.</h3><p>Po dokončení aktivity se zde objeví první agregované výsledky.</p><button class="btn" onclick="setView(\'survey\')">VYPLNIT AKTIVITU →</button></div>';return}let n=db.length;const top=(id,key,base)=>counts(base,r=>r[id]?.[key]||[]);let dna=top('dna','chosen',A[0].items),rej=counts(A[0].items,r=>r.dna?.reject?[r.dna.reject]:[]);let emotion=top('emotion','chosen',A[3].items),change=top('change','chosen',A[4].items),future=top('2029','chosen',A[6].items),mot=counts(A[7].items,r=>r.motive?.choice?[r.motive.choice]:[]),contract=counts(A[5].values,r=>r.contract?.value?[r.contract.value]:[]);let compass=A[1].pairs.map((p,i)=>{let vals=db.map(r=>r.compass?.values?.[i]).filter(Number.isFinite);return `${p[0]} <strong>${vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):'—'}</strong> ${p[1]}`});let chars=A[2].pairs.map((p,i)=>{let vals=db.map(r=>r.character?.values?.[i]).filter(Number.isFinite),avg=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):0;return `<div class="heatitem">${p[0]} <strong>${avg}%</strong><br><span class="subtle">${p[1]}</span><div class="bar"><i style="width:${avg}%"></i></div></div>`}).join('');let headlines=db.map(r=>r['2029']?.headline).filter(Boolean),customs=db.flatMap(r=>[r.contract?.custom,r.motive?.custom].filter(Boolean));$('#dashboard').innerHTML=`<div class="stats"><div class="stat"><strong>${n}</strong><span>Dokončených běhů</span></div><div class="stat"><strong>8</strong><span>Aktivit v mapě</span></div><div class="stat"><strong>${new Set(db.map(x=>new Date(x.at).toDateString())).size}</strong><span>Aktivních dní</span></div></div><div class="grid2">${bars('01 / DNA KKO',dna)}${bars('01 / Vyřazené asociace',rej)}${bars('04 / Emoční stopa',emotion)}${bars('05 / Co by chybělo',change)}${bars('06 / Závazky a hranice',contract)}${bars('07 / Výsledky v roce 2029',future)}${bars('08 / Osobní motivace',mot)}<div class="panel"><h3>02 / Komunikační kompas · průměr</h3>${compass.map(x=>`<div class="heatitem" style="margin:7px 0">${x}</div>`).join('')}</div></div><div class="panel"><h3>03 / Charakter značky · průměrná pozice</h3><div class="heat">${chars}</div></div><div class="grid2"><div class="panel"><h3>07 / Titulky z roku 2029</h3><div class="text-list">${headlines.length?headlines.map(x=>`<div class="response">“${esc(x)}”<small>ANONYMIZOVANÁ ODPOVĚĎ</small></div>`).join(''):'<span class="subtle">Zatím bez titulků.</span>'}</div></div><div class="panel"><h3>Vlastní doplnění</h3><div class="text-list">${customs.length?customs.map(x=>`<div class="response">${esc(x)}</div>`).join(''):'<span class="subtle">Zatím bez textových doplnění.</span>'}</div></div></div>`}
function adminLoginView(error=''){return '<div class="panel"><h3>Administrátorský přístup</h3><p class="subtle">Přihlas se účtem správce. Odpovědi jsou dostupné pouze pověřenému administrátorovi.</p>'+(error?'<p style="color:#9b3c27">'+esc(error)+'</p>':'')+'<form onsubmit="adminLogin(event)"><label class="field-label" for="adminEmail">E-mail</label><input class="textarea" id="adminEmail" type="email" autocomplete="username" required><label class="field-label" for="adminPassword">Heslo</label><input class="textarea" id="adminPassword" type="password" autocomplete="current-password" required><p><button class="btn" type="submit">PŘIHLÁSIT SE →</button></p></form></div>'}async function adminLogin(event){event.preventDefault();try{const response=await fetch(window.KKO_CONFIG.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:window.KKO_CONFIG.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('#adminEmail').value,password:$('#adminPassword').value})});if(!response.ok)throw new Error('login failed');const data=await response.json();sessionStorage.setItem('kko_admin_token',data.access_token);await dashboard()}catch{$('#dashboard').innerHTML=adminLoginView('Přihlášení se nezdařilo. Zkontroluj e-mail a heslo.')}}function exportPDF(){if(!db.length)return alert("Zatím nejsou žádná data k exportu.");window.print()}function exportCSV(){if(!db.length)return alert('Zatím nejsou žádná data.');let rows=[['id','created_at','dna_selected','dna_rejected','compass_values','compass_priority','character_values','character_core','emotion_selected','emotion_rejected','change_selected','change_rejected','contract_sentence','contract_value','contract_custom','2029_selected','2029_headline','motivation','motivation_custom']];db.forEach(r=>{let a=r.answers;rows.push([r.id,r.at,(a.dna?.chosen||[]).join('|'),a.dna?.reject||'',(a.compass?.values||[]).join('|'),a.compass?.priority||'',(a.character?.values||[]).join('|'),(a.character?.core||[]).join('|'),(a.emotion?.chosen||[]).join('|'),a.emotion?.reject||'',(a.change?.chosen||[]).join('|'),a.change?.reject||'',a.contract?.sentence||'',a.contract?.value||'',a.contract?.custom||'',(a['2029']?.chosen||[]).join('|'),a['2029']?.headline||'',a.motive?.choice||'',a.motive?.custom||''])});let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='kko-odpovedi.csv';a.click();URL.revokeObjectURL(a.href)}function clearData(){if(remote){if(confirm('Odhlásit administrátora?')){sessionStorage.removeItem('kko_admin_token');db=[];dashboard()}return}if(confirm('Opravdu vymazat všechna uložená data na tomto zařízení?')){db=[];localStorage.removeItem(key);dashboard()}}render();
</script></body></html>
